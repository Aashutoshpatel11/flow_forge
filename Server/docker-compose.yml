services:
  myKafka:
    image: apache/kafka:latest
    container_name: myKafka
    ports:
      - "9092:9092"
    environment:
      # Configure Kafka as a combined broker and controller (KRaft mode)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@myKafka:29093'

      # Define network listeners for clients and controllers
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'

      # Generate a cluster ID (required for Kraft mode initialization)
      CLUSTER_ID: '4L62YD5vRxm1C501_c24UQ'

      # Set the data storage path
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
    volumes:
      - kafka-data:/var/lib/kafka/data

volumes:
  kafka-data:
